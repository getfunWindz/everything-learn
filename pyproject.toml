[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-learn"
version = "0.4.20"
description = "多平台学习内容 → 中文深度报告（CLI，本地优先）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
media = ["yt-dlp>=2024.0"]
browser = ["playwright>=1.40"]
docx = ["python-docx>=1.0"]
frames = ["av>=12", "pillow>=10"]
all = ["faster-whisper>=1.0", "yt-dlp>=2024.0", "playwright>=1.40",
       "python-docx>=1.0", "av>=12", "pillow>=10"]

[project.scripts]
everything-learn = "scripts.el:main"

[tool.setuptools]
packages = ["scripts", "scripts.core", "scripts.providers"]
