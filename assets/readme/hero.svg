  <title id="heroTitle">everything-learn：一句提示词 → 一条流水线 → 可复习的笔记与知识库</title>
  <desc id="heroDesc">左侧为项目名与四个动作（搜索、抓取、报告、知识库）；右侧为一次真实运行的形状：你说、它做、你得到；底部为 12 个已接入平台，元信息为 955 项离线测试、12 个适配器、MIT、Python 3.10+。</desc>

