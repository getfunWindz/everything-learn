<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="heroTitle heroDesc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="heroTitle">everything-learn：11 平台学习内容 → 中文学习报告</title>
  <desc id="heroDesc">终端风格标题板：左侧为项目名与一句话价值，右侧为真实运行输出（run 命令、字幕+whisper 结果、输出目录），底部为已接入平台列表。</desc>

  <rect width="1200" height="430" rx="26" fill="#0B0F14" stroke="#1F2937" stroke-width="1.5"/>

  <!-- 标题区 -->
  <text x="64" y="76" font-size="20" letter-spacing="1.5" fill="#8B949E"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">多平台学习内容 → 中文学习报告</text>

  <text x="64" y="154" font-size="58" font-weight="700" fill="#E6EDF3">everything-learn</text>
  <rect x="548" y="104" width="18" height="52" rx="3" fill="#3FB950"/>

  <text x="64" y="214" font-size="25" fill="#C9D1D9">11 个平台，一个命令：把视频、播客、图文与社媒内容</text>
  <text x="64" y="250" font-size="25" fill="#C9D1D9">变成结构化的中文学习报告。</text>

  <text x="64" y="308" font-size="19" fill="#8B949E"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">479 offline tests · CI green · MIT · Python 3.10+</text>

  <!-- 终端证据（真实输出形态） -->
  <rect x="664" y="56" width="472" height="276" rx="14" fill="#0D1117" stroke="#263141" stroke-width="1.5"/>
  <circle cx="692" cy="84" r="5" fill="#FF5F56"/>
  <circle cx="712" cy="84" r="5" fill="#FFBD2E"/>
  <circle cx="732" cy="84" r="5" fill="#27C93F"/>
  <text x="752" y="90" font-size="18" fill="#8B949E"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace">el.py — 真实运行输出</text>
  <line x1="664" y1="106" x2="1136" y2="106" stroke="#1F2937" stroke-width="1.5"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="690" y="146" fill="#3FB950">$</text>
    <text x="706" y="146" fill="#E6EDF3">el.py run "&lt;链接&gt;" --out 学习笔记</text>
    <text x="690" y="182" fill="#8B949E">[1/1] 处理 P1 ……</text>
    <text x="866" y="182" fill="#3FB950">→ ok（字幕+whisper，234 行）</text>
    <text x="690" y="218" fill="#C9D1D9">完成！→ 学习笔记/2026-10-14_标题</text>
    <text x="690" y="254" fill="#3FB950">$</text>
    <text x="706" y="254" fill="#E6EDF3">el.py scan "&lt;合集链接&gt;"</text>
    <text x="690" y="290" fill="#C9D1D9">[bilibili] 共 20 条，命中 3 条：</text>
  </g>

  <!-- 已接入平台 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="64" y="379" fill="#8B949E">已接入</text>
    <g fill="#C9D1D9">
      <rect x="146" y="356" width="58" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="160" y="379">B站</text>
      <rect x="216" y="356" width="102" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="230" y="379">YouTube</text>
      <rect x="330" y="356" width="64" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="344" y="379">播客</text>
      <rect x="406" y="356" width="64" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="420" y="379">知乎</text>
      <rect x="482" y="356" width="60" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="496" y="379">TED</text>
      <rect x="554" y="356" width="64" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="568" y="379">微博</text>
      <rect x="630" y="356" width="64" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="644" y="379">抖音</text>
      <rect x="706" y="356" width="82" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="720" y="379">公众号</text>
      <rect x="800" y="356" width="44" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="814" y="379">X</text>
      <rect x="856" y="356" width="82" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="870" y="379">小红书</text>
      <rect x="950" y="356" width="92" height="34" rx="9" fill="#111823" stroke="#223042"/>
      <text x="964" y="379">Medium</text>
    </g>
  </g>
</svg>
