name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（核心 + 可选：yt-dlp/whisper/docx/av）
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=7.0" "requests>=2.28" yt-dlp faster-whisper \
            python-docx av numpy pillow

      - name: editable 安装 smoke
        shell: bash
        run: |
          python -m pip install -e .
          everything-learn --version

      - name: 初始化配置（CI 无本地 config.json）
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from core import config; config.ensure_config(); print('config ok')"

      - name: 运行测试
        shell: bash
        run: |
          python -V
          python -m pytest tests/ -q --tb=line
